<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Shows a generated report. Loaded in a sandboxed frame without same-origin access, so the report (which runs its own
     inline script) can reach neither the page's session nor the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Report</title>
<script src="js/report-frame.js"></script>
</head>
<body></body>
</html>
